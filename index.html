<!doctype html>
<html lang="en">
<head><base href="/heroes-capture/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heroes of the Storm maps</title>
<style>
  :root { --backdrop: #202024; --text: #e8e8ec; --card: #2c2c32; --accent: #8fb4ff; }
  body { margin: 0; padding: 24px 16px; background: var(--backdrop); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p { margin: 0 0 20px; opacity: 0.8; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  a { display: flex; flex-direction: column; gap: 4px; padding: 10px; border-radius: 10px; background: var(--card); color: inherit; text-decoration: none; }
  a:hover span, a:focus-visible span { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  img { width: 100%; height: auto; border-radius: 6px; background: #303036; }
  span { font-weight: 600; }
  small { opacity: 0.7; }
</style>
</head>
<body>
<main>
  <h1>Heroes of the Storm maps</h1>
  <p>Rendered from the game by heroes-capture. Choose a map: drag to pan, mouse wheel to zoom.</p>
  <ul>
      <li><a href="maps/battlefield-of-eternity/"><img src="maps/battlefield-of-eternity/thumbnail.webp" width="512" height="368" alt=""><span>Battlefield of Eternity</span><small>Battleground</small></a></li>
      <li><a href="maps/dragon-shire/"><img src="maps/dragon-shire/thumbnail.webp" width="512" height="366" alt=""><span>Dragon Shire</span><small>Battleground</small></a></li>
      <li><a href="maps/punisher-arena/"><img src="maps/punisher-arena/thumbnail.webp" width="512" height="262" alt=""><span>Punisher Arena</span><small>Arena</small></a></li>
      <li><a href="maps/volskaya-foundry/"><img src="maps/volskaya-foundry/thumbnail.webp" width="512" height="414" alt=""><span>Volskaya Foundry</span><small>Battleground</small></a></li>
  </ul>
</main>
</body>
</html>
