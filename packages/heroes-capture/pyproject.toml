[project]
name = "heroes-capture"
version = "0.0.0"
description = "Captures Heroes of the Storm assets from the game client: battleground maps, sky layers, a parallax viewer"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
  "pyvips[binary]>=2.2",
  "rich>=14",
  "scipy>=1.11",
  "typer>=0.17",
  # Windows only: screen grabbing and input to the game.
  "dxcam>=0.3; sys_platform == 'win32'",
  "mss>=9; sys_platform == 'win32'",
  "pydirectinput>=1.0.4; sys_platform == 'win32'",
  "pmtiles>=3.4",
  "pyyaml>=6",
]

[project.optional-dependencies]
# `ui search`: an image-text model (SigLIP 2, through OpenCLIP) on the CPU. Not in the executable.
search = ["open-clip-torch>=3", "torch>=2.4", "torchvision>=0.19", "transformers>=4.45"]

[project.scripts]
heroes-capture = "heroes_capture.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3"]

# PyPI's Linux torch carries CUDA (gigabytes); the search runs on the CPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heroes_capture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["game_data: reads the game's data from Blizzard's CDN (deselect with -m \"not game_data\")"]
