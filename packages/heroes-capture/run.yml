# What run.cmd runs: a job (heroes_capture/job.py describes it). Kept current with whatever the next
# test or render needs. run.cmd --resume carries on a job that stopped.
#
# Now: Battlefield of Eternity, step 2 of a new map: its whole calibration (step 1, `map survey`,
# was read from the game's data). The data answers whether each structure draws team colour for
# each team (Heaven and Hell look different), so no side switch is timed; each team's look is
# filmed standing on its own. The review form follows from what it shoots.
runs:
  - map: Battlefield of Eternity
    calibrate: all
